<style>
        /* Digital Zen Glassmorphism & Animations */
        body {
            background: radial-gradient(circle at top right, #1a1a3a, #111415 70%);
            min-height: 100vh;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .glow-effect {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(113, 137, 246, 0.2) 0%, rgba(113, 137, 246, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.1); opacity: 0.9; }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #7189f6, #a6ccde);
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.4), 0 4px 12px rgba(113, 137, 246, 0.3);
            transition: all 0.3s ease;
        }
        
        .btn-gradient:hover {
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.6), 0 6px 16px rgba(113, 137, 246, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
