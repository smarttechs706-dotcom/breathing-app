<script>
  (function setupToggles() {
    function wireToggle(id) {
      const btn = document.getElementById(id);
      if (!btn) return;
      btn.addEventListener('click', () => {
        const isChecked = btn.getAttribute('aria-checked') === 'true';
        const thumb = btn.querySelector('div');
        if (isChecked) {
          btn.setAttribute('aria-checked', 'false');
          btn.classList.remove('bg-gradient-to-r', 'from-primary-container', 'to-secondary');
          btn.classList.add('bg-surface-variant');
          thumb.classList.remove('translate-x-5');
          thumb.classList.add('translate-x-0');
        } else {
          btn.setAttribute('aria-checked', 'true');
          btn.classList.remove('bg-surface-variant');
          btn.classList.add('bg-gradient-to-r', 'from-primary-container', 'to-secondary');
          thumb.classList.remove('translate-x-0');
          thumb.classList.add('translate-x-5');
        }
      });
    }

    wireToggle('toggle-reminder');
  })();
</script></main>
